<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>世界7不思議 テストラボ(開発専用・非公開)</title>
<meta name="robots" content="noindex, nofollow">
<!-- このページ以降のすべての相対URL(このファイル自身のscript/link、
     index.htmlから注入する画面が参照する国旗画像等)を、dev/フォルダ
     ではなくリポジトリのルート(index.htmlと同じ階層)基準で解決させる。
     これにより、index.htmlの<body>をそのまま注入しても、その中の
     "./assets/flags/xx.svg"等のパスがdev/配下に誤って解決されることを防ぐ -->
<base href="../">
<!--
  ==========================================================
  世界7不思議 テストラボ(開発専用・本番配信物には含めない)

  このページは何をするものか:
    通常の謎解き126問を実際に獲得しなくても、世界7不思議7問・隠し特別
    トロフィー2種(ミステリーハンター・全知全能の神)・7日間ロック・
    各種演出を、実機(iPhone/iPad/PC)の本物の画面で自由に検証できる
    開発者専用ページ。本番の画面(index.html)は一切変更していない。

  本番からの隔離について:
    1. 保存データの隔離: 下のインラインscriptでwindow.__WFQ_LAB_STORAGE_PREFIX__
       を設定してからjs/storage.jsを読み込む。js/storage.jsはこの値が
       設定されている場合だけ保存キーの接頭辞を差し替えるため、この
       ページでの操作は本番の保存データ(トロフィー獲得記録・7日間ロック・
       ランキング等、すべて"wfq_v1_"から始まるキー)に一切書き込まない
       (このページ専用の"wfq_v1_lab_"という別名前空間に保存される)。
    2. 配信物からの除外: このdev/フォルダはindex.htmlからは一切参照・
       リンクされていない。GitHub Pagesへの公開物は、
       .github/workflows/pages.ymlのビルド手順でdev/フォルダを含めずに
       パッケージングする(ただし、このワークフローを実際に使うには、
       リポジトリのSettings → Pages → Source を「GitHub Actions」に
       変更する、という1回限りの手動設定が別途必要。詳細は完了報告を
       参照)。単なる「リンクしない」「隠しURL」だけでは本当のアクセス
       制限にならないため、この2点を組み合わせて対応している。
  ========================================================== -->
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/map.css">
<link rel="stylesheet" href="css/encyclopedia.css">
<link rel="stylesheet" href="css/findcountry.css">
<link rel="stylesheet" href="css/puzzle.css">
<link rel="stylesheet" href="dev/seven-wonders-lab.css">
</head>
<body>

<div id="wfq-lab-banner" class="wfq-lab-banner">
  🧪 世界7不思議 テストラボ(開発専用・本番データには一切影響しません)
</div>

<!-- 本番(index.html)の画面一式(トロフィー一覧・謎への挑戦画面・解放/全制覇演出
     等)を、起動時にindex.htmlから取得してそのままここへ注入する。
     画面のHTML・CSS・JSは本番と完全に同じものを再利用し、このラボ専用の
     コードは「保存領域の隔離」と「操作パネル」だけに限定する -->
<div id="wfq-lab-app-root"></div>

<div id="wfq-lab-panel" class="wfq-lab-panel" aria-live="polite">
  <p class="wfq-lab-loading">読み込み中…</p>
</div>

<script>
  // js/storage.jsが読み込まれるより前に、必ずこのグローバル変数を設定する。
  // (本番のindex.htmlはこの変数を一切設定しないため、本番の挙動・保存キーは
  // 従来どおり"wfq_v1_"のまま変化しない)
  window.__WFQ_LAB_STORAGE_PREFIX__ = "wfq_v1_lab_";
</script>
<script src="dev/seven-wonders-lab.js"></script>
<script src="dev/seven-wonders-lab-boot.js"></script>
</body>
</html>

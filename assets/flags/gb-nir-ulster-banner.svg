<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40">
  <!-- アルスター・バナー(歴史的な旗、現在の北アイルランドの公式旗ではない)。
       1953年〜1973年に北アイルランド政府(ストーモント)の旗として使われた、
       「聖ジョージの十字+六角星+赤い手(アルスターの赤い手)」という
       紋章学上の意匠(blazon)を、既存のgb-eng.svgと同じ60x40のシンプルな
       ベクター形式で independently に描き起こしたもの。特定の既存SVG
       ファイルを複製・トレースしたものではない -->
  <rect width="60" height="40" fill="#ffffff"/>
  <!-- 聖ジョージの十字(赤)。gb-eng.svgと同じ配色・太さ -->
  <rect x="24" width="12" height="40" fill="#CE1124"/>
  <rect y="14" width="60" height="12" fill="#CE1124"/>
  <!-- 六角星(白、黒縁取り) -->
  <polygon points="30,11.5 37.36,24.25 22.64,24.25" fill="#ffffff" stroke="#1a1a1a" stroke-width="0.5" stroke-linejoin="round"/>
  <polygon points="37.36,15.75 30,28.5 22.64,15.75" fill="#ffffff" stroke="#1a1a1a" stroke-width="0.5" stroke-linejoin="round"/>
  <!-- アルスターの赤い手(右手、手のひらを正面に) -->
  <g transform="translate(30,21.6)" fill="#CE1124" stroke="#8a0a1d" stroke-width="0.3" stroke-linejoin="round">
    <rect x="-2.4" y="-1" width="4.8" height="3.6" rx="1.1"/>
    <rect x="-2.15" y="-3.5" width="0.95" height="2.6" rx="0.42"/>
    <rect x="-1.05" y="-4.4" width="0.95" height="3.5" rx="0.42"/>
    <rect x="0.1" y="-4.7" width="0.95" height="3.8" rx="0.42"/>
    <rect x="1.2" y="-4.2" width="0.95" height="3.3" rx="0.42"/>
    <g transform="rotate(-35 -2.4 0.6)">
      <rect x="-4.3" y="0" width="2" height="1.15" rx="0.5"/>
    </g>
  </g>
  <!-- 王冠(簡略化した金色の冠) -->
  <g fill="#D4AF37" stroke="#7a5c14" stroke-width="0.35" stroke-linejoin="round">
    <rect x="27" y="15.3" width="6" height="1.5" rx="0.3"/>
    <polygon points="27,15.3 28,12.7 29,15.3"/>
    <polygon points="28.8,15.3 30,11.8 31.2,15.3"/>
    <polygon points="31,15.3 32,12.7 33,15.3"/>
    <circle cx="28" cy="12.5" r="0.5" stroke-width="0.2"/>
    <circle cx="30" cy="11.6" r="0.55" stroke-width="0.2"/>
    <circle cx="32" cy="12.5" r="0.5" stroke-width="0.2"/>
    <rect x="26.8" y="16.65" width="6.4" height="0.65" rx="0.3"/>
  </g>
</svg>
